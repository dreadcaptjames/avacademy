<head>

<meta name="description" content="A practical 68-minute AV crash course: signal flow, audio, video, cabling, networking, conferencing and troubleshooting. Then explore the full academy.">
<meta name="theme-color" content="#45261a">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<!-- Intentionally omit apple-mobile-web-app-status-bar-style: on iOS 27,
     black-translucent creates a blurred gradient over the app header.
     An opaque theme-matched surface is provided in css/themes.css. -->
<script>
/* Apply stored appearance before CSS renders to prevent a theme flash. */
(function () {
  const valid = ['analog', 'midnight', 'blueprint', 'minimal', 'synthwave'];
  let selected = 'analog';
  try {
    const saved = localStorage.getItem('signalpath-theme-v1');
    if (valid.includes(saved)) selected = saved;
  } catch (_) { /* private browsing or blocked storage */ }
  document.documentElement.dataset.theme = selected;
  const startupColors = {
    analog:'#45261a', midnight:'#182326', blueprint:'#16374d',
    minimal:'#f5f7f4', synthwave:'#311a4c'
  };
  document.querySelector('meta[name="theme-color"]').setAttribute('content', startupColors[selected]);
})();
</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/crash-course.css">
</head>

<script src="js/app.js"></script>
<script>
(function () {
  const picker = document.getElementById('theme-select');
  const root = document.documentElement;
  const browserBar = document.querySelector('meta[name="theme-color"]');
  const colors = {
    analog: '#45261a',
    midnight: '#182326',
    blueprint: '#16374d',
    minimal: '#f5f7f4',
    synthwave: '#311a4c'
  };
  function apply(theme) {
    if (!Object.hasOwn(colors, theme)) return;
    root.dataset.theme = theme;
    picker.value = theme;
    browserBar.setAttribute('content', colors[theme]);
    try { localStorage.setItem('signalpath-theme-v1', theme); } catch (_) { /* storage optional */ }
  }
  apply(root.dataset.theme || 'analog');
  picker.addEventListener('change', function () { apply(picker.value); });
})();
</script>
